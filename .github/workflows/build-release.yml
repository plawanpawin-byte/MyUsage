name: Build & Release

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage portable zip
        shell: pwsh
        run: |
          $stage = "dist/MyUsage-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/myusage.exe "$stage/myusage.exe"
          Copy-Item installer/install.ps1 "$stage/install.ps1"
          Copy-Item installer/uninstall.ps1 "$stage/uninstall.ps1"
          Copy-Item README.md "$stage/README.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/MyUsage-portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          MYUSAGE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/myusage.iss

      - name: Upload artifacts to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MyUsage-portable.zip
            dist/MyUsageSetup.exe

      - name: Upload build artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MyUsage-build
          path: |
            dist/MyUsage-portable.zip
            dist/MyUsageSetup.exe
