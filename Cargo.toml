[package]
name = "myusage"
version = "0.1.0"
edition = "2021"
description = "Compact Windows widget that tracks AI usage quota (Claude / Codex / ChatGPT) and time until reset."
authors = ["MyUsage"]

[[bin]]
name = "myusage"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
anyhow = "1"
dirs = "5"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

# Smaller / faster release binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
